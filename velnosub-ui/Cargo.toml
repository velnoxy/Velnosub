[package]
name = "velnosub-ui"
version = "0.1.0"
edition = "2021"

# P4.8 dilim 2: cdylib — Android NativeActivity'nin .so yüklediği grafik
# (ANativeActivity_onCreate glue'u android-activity'den gelir; android_main
# lib için bizde). rlib kalır: bin hedefi host dev koşumunu sürer.
[lib]
name = "velnosub_ui"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }

# host derlemesi (android dışı) winit'in masaüstü omurgasını ister:
# default-features kapalıiki x11 hiç etkinleşmediği için aarch64-linux-gnu
# hedefinde winit "platform not supported" derleme hatası veriyordu.
[target.'cfg(not(target_os = "android"))'.dependencies.eframe]
version = "0.37"
features = ["x11"]

# P4.8 dilim 2: AndroidApp doğrudan android-activity'den (winit'in kullandığı
# 0.6.1 ile aynı instance'a birleşir; versiyon ayrışı yok). with_android_app
# trait'i için winit de koşullu bağlanır.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
winit = { version = "0.30.13", features = ["android-native-activity"] }

[profile.release]
debug = false

[workspace]
members = ["abi-smoke"]

[target.aarch64-linux-android]
linker = "/root/velsub/ndk/r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
