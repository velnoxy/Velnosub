[package]
name = "velnosub-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }

# host derlemesi (android dışı) winit'in masaüstü omurgasını ister:
# default-features kapalıiki x11 hiç etkinleşmediği için aarch64-linux-gnu
# hedefinde winit "platform not supported" derleme hatası veriyordu.
[target.'cfg(not(target_os = "android"))'.dependencies.eframe]
version = "0.37"
features = ["x11"]

[profile.release]
debug = false

[workspace]
members = ["abi-smoke"]

[target.aarch64-linux-android]
linker = "/root/velsub/ndk/r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
