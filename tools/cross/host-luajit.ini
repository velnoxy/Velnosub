# velnosub Faz 5 (P5.0) — host'ta luajit.pc görünürlüğü. Meson 1.1+ dış
# PKG_CONFIG_PATH'i yutmaz; bunun yerine native-file pkg_config_libdir
# kullanılır (cross dosyalarındaki pkg_config_libdir kuralıyla aynı biçimde).
[binaries]
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = [
    '/usr/local/lib/aarch64-linux-gnu/pkgconfig',
    '/usr/local/lib/pkgconfig',
    '/usr/local/share/pkgconfig',
    '/usr/lib/aarch64-linux-gnu/pkgconfig',
    '/usr/lib/pkgconfig',
    '/usr/share/pkgconfig',
    '/root/velsub/ndk-deps/luajit-host/lib/pkgconfig',
]
